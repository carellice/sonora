# Publishes a GitHub release with the signed APK whenever server/package.json gets a new version.
# One version for everything: the server (sonora-aggiorna), the web app and the Android app.
name: Release

on:
  push:
    branches: [main]
    paths: [server/package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          v=$(node -p "require('./server/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        if: steps.v.outputs.exists != '1'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.exists != '1'

      - name: Build signed APK
        if: steps.v.outputs.exists != '1'
        working-directory: android
        env:
          SONORA_KEYSTORE: ${{ runner.temp }}/sonora-release.jks
          SONORA_KEYSTORE_PASSWORD: ${{ secrets.SONORA_KEYSTORE_PASSWORD }}
          SONORA_KEY_PASSWORD: ${{ secrets.SONORA_KEY_PASSWORD }}
          SONORA_KEY_ALIAS: sonora
        run: |
          echo "${{ secrets.SONORA_KEYSTORE_BASE64 }}" | base64 -d > "$SONORA_KEYSTORE"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Sonora.apk"

      - name: Publish release
        if: steps.v.outputs.exists != '1'
        run: |
          v=${{ steps.v.outputs.version }}
          gh release create "v$v" "$RUNNER_TEMP/Sonora.apk" --title "Sonora $v" --latest --notes "App Android di Sonora $v.

          Installala dal tuo server (Impostazioni → Scarica l'app Android) oppure scarica Sonora.apk qui sotto.
          I server con sonora-aggiorna si aggiornano a questa versione (ogni notte o con sudo sonora-aggiorna)."
